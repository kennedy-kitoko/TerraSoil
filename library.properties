sentence=Arduino library for NPK Soil Sensor 10-in-1 RS485 (SN-300*-TR-*-N01)
paragraph=Read 10 soil parameters via RS485 Modbus RTU: moisture, temperature, electrical conductivity, pH, NPK (nitrogen, phosphorus, potassium), salinity, TDS, and fertility. Simple one-line API for all measurements. Professional-grade sensor interface with automatic CRC validation, error handling, and unit conversion. Ideal for smart agriculture, precision farming, greenhouse automation, and IoT soil monitoring systems. Compatible with ESP32, ESP32-S3, ESP8266, Arduino Uno/Mega, and other microcontrollers with hardware or software serial support.
